{{- if and .Values.cnpg.external.iam.enabled .Values.cnpg.external.iam.bootstrap.enabled }}
{{- $b := .Values.cnpg.external.iam.bootstrap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xnat.fullname" . }}-db-bootstrap
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
  annotations:
    # Runs (with the Job) as a pre-install/pre-upgrade hook, ahead of the
    # StatefulSet. Lower weight than the Job so the SQL exists first.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  bootstrap.sql: |
    -- Idempotent bootstrap for passwordless RDS IAM auth. Run as the RDS
    -- master against the app database. Identifiers come from psql -v vars
    -- (:'x' = literal, :"x" = quoted identifier), so they are injection-safe.

    -- 1) Passwordless, IAM-authenticated app role. There is no CREATE ROLE
    --    IF NOT EXISTS before PG16, so guard with a generated statement.
    SELECT 'CREATE ROLE ' || quote_ident(:'app_role') || ' WITH LOGIN'
     WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_role')
    \gexec

    -- rds_iam flips the role to IAM-token-only auth. Idempotent. Never grant
    -- it to the master, which would lock out this password-based bootstrap.
    GRANT rds_iam TO :"app_role";

    -- Baseline grants (no-ops once the role owns the schema below).
    GRANT CONNECT ON DATABASE :"app_db" TO :"app_role";
    GRANT USAGE, CREATE ON SCHEMA public TO :"app_role";
    {{- if and $b.reassignFrom (ne $b.reassignFrom .Values.cnpg.cluster.credentials.username) }}

    -- 2) Restored-from-snapshot ownership migration: existing objects are
    --    owned by the old master role. REASSIGN OWNED requires the executor
    --    (the master) to be a member of BOTH roles, hence the GRANT first.
    GRANT :"app_role" TO :"reassign_from";
    REASSIGN OWNED BY :"reassign_from" TO :"app_role";
    ALTER DATABASE :"app_db" OWNER TO :"app_role";
    ALTER SCHEMA public OWNER TO :"app_role";
    {{- end }}
{{- end }}
