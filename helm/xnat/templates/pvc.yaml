{{- $context := . -}}
{{- range $name, $c := .Values.volumes }}
{{- if .existingClaim }}
{{- else if .size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "xnat.fullname" $context }}-{{ $name }}
  labels:
    {{- include "xnat.labels" $context | nindent 4 }}
  {{- if has $name (list "archive" "prearchive" "cache") }}
  annotations:
    # 4.0 stops rendering these three claims: archive, prearchive and cache
    # become directories on the xnatdata mount. Helm and Flux are stopped from
    # deleting them by a guard in 4.0, but a render-and-apply pipeline such as
    # Argo CD is not -- it would prune them, and with reclaimPolicy: Delete the
    # data goes too. Stamping this while 3.x still renders the claims means
    # Argo refuses that prune. keep does the same for helm uninstall, and for
    # the 4.0 upgrade itself if its guard is ever bypassed. It does not
    # satisfy that guard, which also requires a marker only an operator sets.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
  {{- end }}
spec:
  accessModes: [ {{ $c.accessMode | quote }} ]
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ $c.size | quote }}
  {{- if or $c.nfs $c.hostVolume }}
  volumeName: {{ include "xnat.fullname" $context }}-{{ $name }}
  storageClassName: ""
  {{- else if eq $c.storageClass "csi-cephfs-sc" }}
  volumeName: {{ include "xnat.fullname" $context }}-{{ $name }} 
  storageClassName: {{ $c.storageClass }}
  {{- else if $c.storageClass }}
  storageClassName: {{ $c.storageClass }}
  {{- end }}
{{- end }}
{{- end }}
