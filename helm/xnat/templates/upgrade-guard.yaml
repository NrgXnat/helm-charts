{{/*
Two upgrade guards. Both are scoped to .Release.IsUpgrade: on a fresh install
Helm deletes nothing and refuses to adopt an existing object, so neither
hazard applies and a same-named leftover claim must not block the install.

lookup returns nothing under `helm template` and client-side `--dry-run`, so
both are inert in CI renders.

Two limits worth stating plainly. They cover Helm and Flux's helm-controller,
which both run lookup; they do NOT cover a render-and-apply pipeline -- Argo
CD, `helm template | kubectl apply --prune`, kustomize --enable-helm -- where
lookup is empty and the keep annotation in pvc.yaml only ever lands on claims
this chart still renders, never on the legacy ones. Those consumers get the
prune these guards exist to prevent, unwarned; README.md tells them what to do
by hand. And they make `get persistentvolumeclaims` in the release namespace a
rendering prerequisite: without that RBAC, Helm surfaces the Forbidden error
and every upgrade of this chart fails here, including upgrades that touch no
volume at all.

Renders no object.
*/}}
{{- if .Release.IsUpgrade }}
{{- $vols := default dict .Values.volumes }}

{{/*
GUARD 1 -- a size change silently patches a live claim.

Changing a size in values rewrites resources.requests.storage on the bound
claim. A StorageClass without allowVolumeExpansion rejects that outright, and
where expansion is allowed it succeeds and is irreversible: Kubernetes has no
shrink. 4.0.0 raises the xnatdata default, so a release that never set it
explicitly would be resized by the upgrade alone.

Compares the rendered size against the live one as strings, so two spellings
of one quantity (1Ti vs 1024Gi) read as a change. The remedy is the same
either way and it fails safe rather than silently.
*/}}
{{- $resized := list }}
{{- range $name, $c := $vols }}
{{- if and $c $c.size (not $c.existingClaim) (ne (toString $c.allowResize) "true") }}
{{- $claim := printf "%s-%s" (include "xnat.fullname" $) $name }}
{{- $live := lookup "v1" "PersistentVolumeClaim" $.Release.Namespace $claim }}
{{- if $live }}
{{- $was := dig "spec" "resources" "requests" "storage" "" $live }}
{{- if and $was (ne (toString $was) (toString $c.size)) }}
{{- $resized = append $resized (printf "%s: %s -> %s  (volumes.%s.size)" $claim (toString $was) (toString $c.size) $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $resized }}
{{- fail (printf `
This upgrade would change the storage request on claims that already exist:

    %s

Kubernetes cannot shrink a claim, and a StorageClass without
allowVolumeExpansion rejects any change at all -- so this either fails the
upgrade or grows the volume irreversibly.

If you are MERGING archive, prearchive and cache onto xnatdata, it has to grow
to hold all three, not stay where it is. Set the size you need and say you
mean it:

    volumes.xnatdata.size: <big enough for all three>
    volumes.xnatdata.allowResize: true

Otherwise you are probably just inheriting the 4.0.0 default, which raised
xnatdata because it now carries those directories. Pin the volume to what it
already has:

    volumes.<name>.size: <the value on the left above>
` (join "\n    " $resized)) }}
{{- end }}

{{/*
GUARD 2 -- the claims 4.0.0 stops rendering.

Before 4.0.0 the chart rendered <fullname>-{archive,prearchive,cache} as
claims of their own. 4.0.0 makes them directories on the xnatdata mount, so
those claims leave the release -- and Helm deletes what leaves a release
unless the live object is annotated helm.sh/resource-policy: keep. On a
StorageClass with the default reclaimPolicy: Delete the PersistentVolume, and
the data, go too.

The condition mirrors pvc.yaml, which renders a claim only when a size is set
AND no existingClaim is: setting existingClaim suppresses the rendered claim
just as an absent size does, so adopting the legacy claim that way would
otherwise delete the very claim the StatefulSet has just been pointed at.
*/}}
{{- $doomed := list }}
{{- range $n := list "archive" "prearchive" "cache" }}
{{- if or (dig $n "existingClaim" "" $vols) (not (dig $n "size" "" $vols)) }}
{{- $claim := printf "%s-%s" (include "xnat.fullname" $) $n }}
{{- $live := lookup "v1" "PersistentVolumeClaim" $.Release.Namespace $claim }}
{{- if $live }}
{{- if ne (dig "metadata" "annotations" "helm.sh/resource-policy" "" $live) "keep" }}
{{- $doomed = append $doomed $claim }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $doomed }}
{{- fail (printf `
Upgrading would DELETE these claims, which still exist in %s:

    %s

Chart 4.0.0 makes archive, prearchive and cache directories on the xnatdata
mount, so they are no longer part of the release. Helm removes what leaves a
release, and on a StorageClass with reclaimPolicy: Delete that destroys the
PersistentVolume and everything in it.

Pick one, then upgrade again.

 1. KEEP THE SPLIT LAYOUT. Set volumes.<name>.size back to the request the live
    claim already has, leaving its accessMode and storageClass in place. Moving
    a session from the prearchive to the archive stays a copy rather than a
    rename, which is why this is no longer the default.

 2. ADOPT A CLAIM WHERE IT IS. Point volumes.<name>.existingClaim at it AND
    annotate it -- an existingClaim is not rendered either, so the annotation
    is what stops Helm removing it:

      kubectl -n %s annotate pvc <name> helm.sh/resource-policy=keep

 3. MOVE TO THE SINGLE MOUNT. Grow xnatdata first -- it has to hold all three,
    and 4.0.0's default is a starting point, not their sum:

      volumes.xnatdata.size: <big enough for all three>
      volumes.xnatdata.allowResize: true

    Copy the data BEFORE upgrading. Afterwards /data/xnat/archive is an empty
    directory while the database still references every archived session, so
    XNAT serves a broken archive and can write new sessions into the empty
    tree. The orphaned claims are also unmounted by then.

      kubectl -n %s annotate pvc %s helm.sh/resource-policy=keep
      kubectl -n %s scale statefulset %s --replicas=0
      # copy each claim into the matching directory of the xnatdata volume
      # with a helper pod that mounts both. Copy AS uid 1000, or chown -R
      # 1000:1000 afterwards: fsGroupChangePolicy is OnRootMismatch and the
      # xnatdata root already matches, so the kubelet will NOT relabel what
      # you put inside it, and XNAT runs as uid 1000.
      # then upgrade, and delete the orphaned claims once you have verified it

    If these are NFS or hostVolume claims you must also set nfs: false /
    hostVolume: false on each, or the render fails for want of a size; for NFS
    the data also moves from <pathPrefix>/<name> to <pathPrefix>/xnatdata/<name>.
    This chart renders their PersistentVolumes too, and only the claims carry
    the keep annotation -- annotate the PVs as well:

      kubectl annotate pv <pv-name> helm.sh/resource-policy=keep
` $.Release.Namespace (join "\n    " $doomed) $.Release.Namespace $.Release.Namespace (join " " $doomed) $.Release.Namespace (include "xnat.fullname" $)) }}
{{- end }}
{{- end }}
