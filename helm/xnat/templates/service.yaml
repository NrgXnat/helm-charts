apiVersion: v1
kind: Service
metadata:
  name: {{ include "xnat.fullname" . }}
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
    {{- if .Values.metrics.jmx.enabled }}
    - port: {{ .Values.metrics.jmx.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "xnat.selectorLabels" . | nindent 4 }}
  sessionAffinity: "ClientIP"
{{ if (eq .Values.service.type "ClusterIP") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xnat.fullname" . }}-headless
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "xnat.selectorLabels" . | nindent 4 }}
  sessionAffinity: "ClientIP"
{{- end }}
{{- if .Values.dicom_scp.recievers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xnat.fullname" . }}-dicom-scp
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
  {{- with .Values.dicom_scp.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dicom_scp.serviceType | quote }}
  {{- $serviceType := .Values.dicom_scp.serviceType }}
  {{- with include "xnat.dicomScpLoadBalancerIP" . }}
  {{- if eq $serviceType "LoadBalancer" }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- end }}
  ports:
    {{- range include "xnat.dicomScpPorts" . | fromJsonArray }}
    - name: {{ .port }}-dicom
      port: {{ .port }}
      targetPort: {{ .port }}
      {{- if and (eq $serviceType "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "xnat.selectorLabels" . | nindent 4 }}
  sessionAffinity: "ClientIP"
{{- end }}
