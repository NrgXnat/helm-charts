{{- $context := . -}}
{{- range $name, $c := .Values.volumes }}
{{- if .existingClaim }}
{{- else }}
{{- if and (or .nfs .hostVolume) (not $c.size) }}
{{- fail (printf "volumes.%s: %s is true but size is unset. This chart renders the PersistentVolume itself, and capacity.storage has no default -- set volumes.%s.size." $name (ternary "nfs" "hostVolume" (not (not .nfs))) $name) }}
{{- end }}
{{- end }}
{{- if .existingClaim }}
{{- else if .nfs }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "xnat.fullname" $context }}-{{ $name }}
  labels:
    {{- include "xnat.labels" $context | nindent 4 }}
spec:
  capacity:
    storage: {{ $c.size | quote }}
  volumeMode: Filesystem
  accessModes: [ {{ $c.accessMode | quote }} ]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    {{- toYaml $context.Values.nfs.mountOptions | nindent 4 }}
  nfs:
    server: {{ $context.Values.nfs.server }}
    path: "{{ $context.Values.nfs.pathPrefix }}/{{ $name }}"
{{- else if .hostVolume }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "xnat.fullname" $context }}-{{ $name }}
  labels:
    {{- include "xnat.labels" $context | nindent 4 }}
spec:
  capacity:
    storage: {{ $c.size | quote }}
  claimRef:
    name: {{ include "xnat.fullname" $context }}-{{ $name }}
    namespace: {{ $context.Values.namespace }}
  accessModes: [ {{ $c.accessMode | quote }} ] 
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "{{ $c.rootPath }}"
{{- end }}
{{- end }}
