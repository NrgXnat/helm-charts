{{- $context := . -}}
{{- range $name, $c := .Values.volumes }}
{{- if .existingClaim }}
{{- else if .nfs }}
{{- if not $c.size }}{{ fail (printf "volumes.%s.nfs is true but volumes.%s.size is unset; an NFS PersistentVolume needs capacity.storage" $name $name) }}{{ end }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "xnat.fullname" $context }}-{{ $name }}
  labels:
    {{- include "xnat.labels" $context | nindent 4 }}
spec:
  capacity:
    storage: {{ $c.size | quote }}
  volumeMode: Filesystem
  accessModes: [ {{ $c.accessMode | quote }} ]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    {{- toYaml $context.Values.nfs.mountOptions | nindent 4 }}
  nfs:
    server: {{ $context.Values.nfs.server }}
    path: "{{ $context.Values.nfs.pathPrefix }}/{{ $name }}"
{{- else if .hostVolume }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "xnat.fullname" $context }}-{{ $name }}
  labels:
    {{- include "xnat.labels" $context | nindent 4 }}
spec:
  capacity:
    storage: {{ $c.size | quote }}
  claimRef:
    name: {{ include "xnat.fullname" $context }}-{{ $name }}
    namespace: {{ $context.Values.namespace }}
  accessModes: [ {{ $c.accessMode | quote }} ] 
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "{{ $c.rootPath }}"
{{- end }}
{{- end }}
