apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "xnat.fullname" . }}
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
spec:
  {{- if .Values.nodeName }}
  replicas: 1
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    # Stable identity labels only. spec.selector is immutable, so a mutable label
    # here (this used to include version: <appVersion>) makes every appVersion
    # change an immutable-field update that helm upgrade cannot apply. The pod
    # template below keeps the fuller label set; a selector being a subset of the
    # pod labels is the intended shape, and matches every other object in the chart.
    matchLabels:
      {{- include "xnat.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "xnat.fullname" . }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "xnat.statefulsetLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{ if .Values.hostAliases }}
      hostAliases:
      {{- range $value, $v := .Values.hostAliases }}
      - hostnames:
        - {{ $v.hostname }}
        ip: {{ $v.ip }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "xnat.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.nodeName }}
      hostNetwork: true
      nodeName: {{ .Values.nodeName }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if or .Values.jvm.enabled .Values.metrics.jmx.enabled .Values.logConsole .Values.extraEnv }}
          env:
            {{- if or .Values.jvm.enabled .Values.metrics.jmx.enabled }}
            # JAVA_TOOL_OPTIONS is honoured by every JVM regardless of the
            # image's launcher, so heap sizing (jvm.*) and the Prometheus JMX
            # java agent (metrics.jmx) work without knowing whether xnat-web
            # reads JAVA_OPTS or CATALINA_OPTS. The JVM logs a one-line
            # "Picked up JAVA_TOOL_OPTIONS:" notice to stderr.
            - name: JAVA_TOOL_OPTIONS
              value: {{ include "xnat.javaToolOptions" . | quote }}
            {{- end }}
            {{- if .Values.logConsole }}
            # Native stdout logging on XNAT builds that support it (XNAT-8782 /
            # NrgXnat/xnat#23): redirects all logging (core + plugins) to stdout as
            # plain text or JSON. Ignored by images that predate the variable, so it is
            # safe to set unconditionally.
            - name: XNAT_LOG_CONSOLE
              value: {{ .Values.logConsole | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            # Arbitrary extra env vars (raw Kubernetes env entries; supports value / valueFrom).
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.jmx.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.jmx.port }}
              protocol: TCP
            {{- end }}
          # Probes use a TCP socket on the http port rather than an HTTP GET:
          # XNAT's health path varies by version and the old default
          # (/app/template/Login.vm#!) 404s on current xnat-web, while the #!
          # fragment is never sent server-side. "Is Tomcat accepting on 8080?"
          # is the version-agnostic readiness signal.
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            tcpSocket:
              port: http
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: passwd
              mountPath: /etc/passwd
              readOnly: true
              subPath: passwd
            - name: tomcat
              mountPath: /usr/local/tomcat
            {{- if .Values.devWar.enabled }}
            # Shadows the image's webapps dir with the side-loaded WAR (dev only).
            - name: webapps
              mountPath: /usr/local/tomcat/webapps
            {{- end }}
            - name: conf-catalina
              mountPath: /usr/local/tomcat/conf/Catalina
            - name: xnat-home
              mountPath: /data/xnat/home
            - name: home-plugins
              mountPath: /data/xnat/home/plugins
            {{- if .Values.metrics.jmx.enabled }}
            - name: jmx-agent
              mountPath: /jmx
              readOnly: true
            - name: jmx-config
              mountPath: /etc/jmx
              readOnly: true
            {{- end }}
            {{- range $plugin, $p := .Values.authplugins }}
            {{- if .auth }}
            - name: auth-{{ $p.provider }}
              mountPath: /data/xnat/home/config/auth/{{ $p.provider }}-provider.properties
              readOnly: true
              subPath: {{ $p.provider }}-provider.properties
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
            {{- range $name, $c := .Values.persistence }}
            {{- if $c.size }}
            - mountPath: {{ $c.mountPath | quote }}
              name: {{ $name | quote }}
            {{- end }}
            {{- end }}
            {{- range $name, $c := .Values.volumes }}
            {{- if $c.size }}
            - mountPath: {{ $c.mountPath | quote }}
              name: {{ $name | quote }}
              {{- if $c.mountPropagation }}
              mountPropagation: {{$c.mountPropagation|default "None"|quote}}
              {{- end }}
            {{- end }}
            {{- end }}
      initContainers:
        {{- if .Values.metrics.jmx.enabled }}
        - name: jmx-agent
          image: {{ required "metrics.jmx.image is required when metrics.jmx.enabled (it must contain the Prometheus jmx_prometheus_javaagent jar)" .Values.metrics.jmx.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "-c", "cp {{ .Values.metrics.jmx.agentJarPath }} /jmx/agent.jar"]
          {{- with .Values.metrics.jmx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: jmx-agent
              mountPath: /jmx
        {{- end }}
        {{- if .Values.pluginInstaller.s3.syncPrefix }}
        # Bulk S3 install: copy every JAR staged under the release prefix into
        # the shared home-plugins volume with the AWS CLI (pod IRSA role). The
        # plugin SET is whatever was staged to S3 -- no per-plugin list to keep
        # in sync with the release manifest.
        - name: install-plugins-from-s3
          image: {{ required "pluginInstaller.s3.image is required when pluginInstaller.s3.syncPrefix is set" .Values.pluginInstaller.s3.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- include "xnat.installerSecurityContext" . | nindent 12 }}
          command:
            - aws
            {{- with .Values.pluginInstaller.s3.endpointUrl }}
            - --endpoint-url
            - {{ . | quote }}
            {{- end }}
            - s3
            - cp
            - --recursive
            - {{ printf "s3://%s/%s/" (required "pluginInstaller.s3.bucket is required for syncPrefix" .Values.pluginInstaller.s3.bucket) (trimSuffix "/" (required "pluginInstaller.s3.prefix is required for syncPrefix (an empty prefix would recursively copy the whole bucket into the plugins dir)" .Values.pluginInstaller.s3.prefix)) | quote }}
            - /data/xnat/home/plugins/
          {{- include "xnat.s3Env" . | nindent 10 }}
          volumeMounts:
            - name: home-plugins
              mountPath: /data/xnat/home/plugins
        {{- end }}
        {{- range $plugin, $c := .Values.plugins }}
        {{- if eq ($c.source | default "") "s3" }}
        # S3 form: copy a pre-staged JAR from the release bucket with the AWS CLI,
        # using the pod's IRSA role. No custom installer image and no in-cluster
        # Maven/registry auth -- acquire (and any logback rewrite) happen at
        # staging time, so the test pulls the exact bytes that ship.
        - name: {{ $plugin }}
          image: {{ required "pluginInstaller.s3.image is required when a plugins entry sets source: s3" $.Values.pluginInstaller.s3.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            {{- include "xnat.installerSecurityContext" $ | nindent 12 }}
          command:
            - aws
            {{- with $.Values.pluginInstaller.s3.endpointUrl }}
            - --endpoint-url
            - {{ . | quote }}
            {{- end }}
            - s3
            - cp
            - {{ $c.s3Uri | default (printf "s3://%s/%s/%s" $.Values.pluginInstaller.s3.bucket (trimSuffix "/" $.Values.pluginInstaller.s3.prefix) ($c.target | default (printf "%s.jar" $plugin))) | quote }}
            - {{ printf "/data/xnat/home/plugins/%s" ($c.target | default (printf "%s.jar" $plugin)) | quote }}
          {{- include "xnat.s3Env" $ | nindent 10 }}
          volumeMounts:
            - name: home-plugins
              mountPath: /data/xnat/home/plugins
        {{- else if $c.source }}
        # Source form: fetch a raw JAR (url|coordinates|file) into the shared
        # home-plugins volume, on a stock curl image -- no custom installer image,
        # same as the s3 form above. Coordinates and urls are both resolved while
        # rendering, so the url actually fetched is visible here.
        - name: {{ $plugin }}
          image: {{ $.Values.pluginInstaller.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            {{- include "xnat.installerSecurityContext" $ | nindent 12 }}
          command: ['sh', '-c']
          args:
            - |
              {{- include "xnat.pluginFetch" (dict "plugin" $c "name" $plugin "repo" $.Values.pluginRepository "caCert" (and $.Values.pluginInstaller.caCertSecret (ne $c.source "file"))) | nindent 14 }}
          volumeMounts:
            - name: home-plugins
              mountPath: /data/xnat/home/plugins
            {{- if and (eq $c.source "file") $c.secret }}
            - name: plugin-{{ $plugin }}-jar
              mountPath: /mnt/plugin-{{ $plugin }}
              readOnly: true
            {{- end }}
            {{- if and $.Values.pluginInstaller.caCertSecret (ne $c.source "file") }}
            - name: plugin-ca
              mountPath: /mnt/plugin-ca
              readOnly: true
            {{- end }}
        {{- else }}
        # Image form: pre-built plugin OCI image; its entrypoint copies the JAR in.
        - name: {{ $plugin }}
          image: "{{ required (printf "plugins.%s: `repository` is required for the image form (or set `source`)" $plugin) $c.repository }}:{{ required (printf "plugins.%s: `tag` is required for the image form" $plugin) $c.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          volumeMounts:
            - name: home-plugins
              mountPath: /data/xnat/home/plugins
        {{- end }}
        {{- end }}
        {{- if .Values.devPlugins.enabled }}
        # DEV/TEST: copy every jar staged under the dev prefix into the plugins
        # volume. Deliberately rendered after the plugins above so a locally built
        # jar overrides a declared one of the same name -- that is the point of a
        # side-load, and it is why this is not pluginInstaller.s3.syncPrefix, which
        # installs a release set and must not silently outrank a pinned version.
        - name: dev-plugins
          image: {{ required "pluginInstaller.s3.image is required when devPlugins.enabled" .Values.pluginInstaller.s3.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- include "xnat.installerSecurityContext" . | nindent 12 }}
          {{- include "xnat.s3Env" . | nindent 10 }}
          command:
            - aws
            {{- with .Values.pluginInstaller.s3.endpointUrl }}
            - --endpoint-url
            - {{ . | quote }}
            {{- end }}
            - s3
            - cp
            - --recursive
            - {{ required "devPlugins.s3Uri is required when devPlugins.enabled (e.g. s3://bucket/dev/plugins/)" .Values.devPlugins.s3Uri | quote }}
            - /data/xnat/home/plugins/
          volumeMounts:
            - name: home-plugins
              mountPath: /data/xnat/home/plugins
        {{- end }}
        {{- if .Values.activemq.broker.enabled }}
        - name: wait-for-amq
          image: busybox:1.36
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for ActiveMQ broker to be ready..."
              until nc -z activemq-artemis-{{ template "xnat.fullname" . }}-0-svc {{ .Values.activemq.broker.port }}; do
                echo "ActiveMQ broker not ready yet, waiting..."
                sleep 5
              done
              echo "ActiveMQ broker is ready!"
        {{- end }}
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for Postgres to be ready"
              until nc -z {{ template "xnat.postgresql.postgresqlUri" . }} {{ template "xnat.postgresql.postgresqlPort" . }}; do
                echo "Postgres not ready yet, waiting..."
                sleep 5
              done
              echo "Postgres is ready!"
        {{- if .Values.initContainers }}
        {{- with .Values.initContainers }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if .Values.devWar.enabled }}
        {{- $w := .Values.devWar }}
        # DEV/TEST: fetch a WAR into the `webapps` volume, which the main
        # container mounts over /usr/local/tomcat/webapps. Deliberately a separate
        # volume: home-init seeds the `tomcat` volume from the image and runs
        # after this, so a WAR written there would be overwritten.
        - name: dev-war
          {{- if eq $w.source "s3" }}
          image: {{ required "pluginInstaller.s3.image is required when devWar.source is s3" .Values.pluginInstaller.s3.image }}
          {{- else }}
          image: {{ .Values.pluginInstaller.image | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- include "xnat.installerSecurityContext" . | nindent 12 }}
          {{- if eq $w.source "s3" }}
          {{- include "xnat.s3Env" . | nindent 10 }}
          {{- end }}
          command: ['sh', '-c']
          args:
            - |
              set -eu
              {{- if eq $w.source "s3" }}
              aws{{ with .Values.pluginInstaller.s3.endpointUrl }} --endpoint-url {{ . | quote }}{{ end }} s3 cp {{ required "devWar.s3Uri is required when devWar.source is s3" $w.s3Uri | quote }} "/webapps/ROOT.war.part"
              {{- else if eq $w.source "file" }}
              cp {{ required "devWar.file is required when devWar.source is file" $w.file | quote }} "/webapps/ROOT.war.part"
              {{- else }}
              curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused{{ if .Values.pluginInstaller.caCertSecret }} --cacert /mnt/plugin-ca/ca.crt{{ end }} -o "/webapps/ROOT.war.part" {{ required "devWar.url is required when devWar.source is url" $w.url | quote }}
              {{- end }}
              {{- with $w.sha256 }}
              echo {{ . | quote }}"  /webapps/ROOT.war.part" | sha256sum -c -
              {{- end }}
              mv "/webapps/ROOT.war.part" "/webapps/ROOT.war"
          volumeMounts:
            - name: webapps
              mountPath: /webapps
            {{- if and .Values.pluginInstaller.caCertSecret (eq $w.source "url") }}
            - name: plugin-ca
              mountPath: /mnt/plugin-ca
              readOnly: true
            {{- end }}
        {{- end }}
        - name: home-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Same securityContext as the main container. The chown below is guarded
          # on `id -u`, so pinning a uid here just takes the non-root branch; a
          # root-USER image needs .Values.securityContext relaxed, which such an
          # image already requires for the main container.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - 'bash'
            - '-c'
            - |
              set -x
              shopt -s extglob
              # Copy Tomcat folder
              [ -d /TOMCAT ] && cp -r --preserve=mode,timestamps /usr/local/tomcat/* /TOMCAT
              # chown only when running as root. With a root-USER image, home-init
              # runs as root and must re-own the copied tree to the runtime uid.
              # With a non-root image it already runs as that uid (files are
              # created correctly owned), and the pod fsGroup covers the
              # volume-root dirs -- so the chown is unnecessary and would EPERM.
              # Guarding on uid lets home-init work for both root and non-root images.
              if [ "$(id -u)" = "0" ]; then
                chown -R {{ default "1000" .Values.securityContext.runAsUser }} /TOMCAT
              fi
              # Setup xnat-conf.properties
              readarray -d - -t REP <<< "${POD_NAME}"
              cp /tmp/xnat-conf.properties ${XNAT_HOME}/config/xnat-conf.properties
              # Guarantee a trailing newline before appending: without it the
              # echo below glues xnat.is_primary_node onto the last property of
              # the source file (e.g. "...=truexnat.is_primary_node=true"),
              # which Spring then fails to parse and the webapp never deploys.
              [ "$(tail -c 1 ${XNAT_HOME}/config/xnat-conf.properties)" = "" ] || echo "" >> ${XNAT_HOME}/config/xnat-conf.properties
              {{- if .Values.cnpg.cluster.credentials.externalSecret }}
              # Datasource password is sourced at runtime from the external
              # secret (via XNAT_DB_PASSWORD) so it stays out of the rendered
              # config Secret. Everything that touches the password runs inside
              # the { set +x; } window so the script's top-level `set -x` does
              # not echo it to the pod log; do not reference XNAT_DB_PASSWORD
              # after `set -x` resumes. printf %s handles any special chars.
              { set +x; } 2>/dev/null
              if [ -z "${XNAT_DB_PASSWORD}" ]; then
                echo "ERROR: externalSecret {{ .Values.cnpg.cluster.credentials.externalSecret }} key {{ .Values.cnpg.cluster.credentials.externalSecretPasswordKey | default "password" }} is empty or missing" >&2
                exit 1
              fi
              printf 'datasource.password=%s\n' "${XNAT_DB_PASSWORD}" >> ${XNAT_HOME}/config/xnat-conf.properties
              set -x
              {{- end }}
              if [[ "${REP[-1]}" -eq "0" ]]; then
                echo "xnat.is_primary_node=true" >> ${XNAT_HOME}/config/xnat-conf.properties
              else
                echo "xnat.is_primary_node=false" >> ${XNAT_HOME}/config/xnat-conf.properties
              fi
              echo "node.id=$(hostname)" > ${XNAT_HOME}/config/node-conf.properties
              # Copy XNAT_HOME directory excluding the plugins folder
              cp -r --preserve=mode,timestamps ${XNAT_HOME}/!(plugins) /XNAT_HOME
              # See the /TOMCAT chown above: root-only, so non-root images skip it.
              # (A no-op `if` also keeps home-init's exit code 0 when non-root.)
              if [ "$(id -u)" = "0" ]; then
                chown -R {{ default "1000" .Values.securityContext.runAsUser }} /XNAT_HOME
                chown -R {{ default "1000" .Values.securityContext.runAsUser }} /HOME-PLUGINS
              fi
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name           
          {{- if .Values.cnpg.cluster.credentials.externalSecret }}
          - name: XNAT_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cnpg.cluster.credentials.externalSecret }}
                key: {{ .Values.cnpg.cluster.credentials.externalSecretPasswordKey | default "password" }}
          {{- end }}
          volumeMounts:
            - name: tomcat
              mountPath: /TOMCAT
            - name: xnat-home
              mountPath: /XNAT_HOME
            - name: home-plugins
              mountPath: /HOME-PLUGINS
            - name: xnat-config
              mountPath: /tmp/xnat-conf.properties
              readOnly: true
              subPath: xnat-conf.properties

      volumes:
        - name: passwd
          configMap:
            name: {{ include "xnat.fullname" . }}
            items:
              - key: passwd
                path: passwd
        - name: tomcat
          emptyDir: {}
        # SEVERE: Unable to create directory for deployment: [/usr/local/tomcat/conf/Catalina/localhost]
        - name: conf-catalina
          emptyDir: {}
        - name: xnat-home
          emptyDir: {}
        - name: home-plugins
          emptyDir: {}
        {{- if .Values.devWar.enabled }}
        - name: webapps
          emptyDir: {}
        {{- end }}
        {{- with .Values.pluginInstaller.caCertSecret }}
        - name: plugin-ca
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- range $plugin, $c := .Values.plugins }}
        {{- if and (eq ($c.source | default "") "file") $c.secret }}
        - name: plugin-{{ $plugin }}-jar
          secret:
            secretName: {{ required (printf "plugins.%s.secret needs a name" $plugin) $c.secret.name }}
        {{- end }}
        {{- end }}
        {{- if .Values.metrics.jmx.enabled }}
        - name: jmx-agent
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: {{ include "xnat.fullname" . }}-jmx
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        {{- range $plugin, $p := .Values.authplugins }}
        {{- if $p.auth }}
        - name: auth-{{ $p.provider }}
          secret:
            secretName: xnat-plugin-{{ $plugin }}
            items:
              - key: {{ $p.provider }}-provider-properties
                path: {{ $p.provider }}-provider.properties
        {{- end }}
        {{- end }}
        - name: xnat-config
          secret:
            secretName: {{ include "xnat.fullname" . }}
        {{- $context := . -}}
        {{- range $name, $c := .Values.volumes }}
        {{- if $c.size }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $c.existingClaim | default (printf "%s-%s" (include "xnat.fullname" $context) $name) }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- range $name, $c := .Values.persistence }}
    {{- if not $c.existingClaim }}
    {{- if $c.size }}
    - metadata:
        name: {{ $name | quote }}
      spec:
        accessModes: [ {{ $c.accessMode | quote }} ]
        {{- if (or $c.storageClass $.Values.global.storageClass) }}
        storageClassName: {{ $c.storageClass | default $.Values.global.storageClass | quote }}
        {{- end }}
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ $c.size }}
    {{- end }}
    {{- end }}
    {{- end }}
