{{- if .Values.createConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xnat.fullname" . }}
  labels:
    {{- include "xnat.labels" . | nindent 4 }}
type: Opaque
stringData:
  xnat-conf.properties: |
    #
    # xnat-conf.properties
    # XNAT http://www.xnat.org
    # Copyright (c) 2016, Washington University School of Medicine
    # All Rights Reserved
    #
    # Released under the Simplified BSD.
    #
{{- if .Values.cnpg.external.iam.enabled }}
    {{- /* Passwordless RDS IAM auth via the AWS Advanced JDBC Wrapper. The
           wrapper's iam plugin mints a short-lived RDS token and injects it as
           the password, so datasource.password is deliberately empty. Wrapper
           and TLS options ride in the URL query string because XNAT only
           exposes datasource.driver/url/username/password. Requires an image
           that bundles the AWS Advanced JDBC Wrapper (+ AWS SDK for Java v2)
           and the RDS CA bundle at sslrootcert. */}}
    datasource.driver=software.amazon.jdbc.Driver
    datasource.url=jdbc:aws-wrapper:postgresql://{{ template "xnat.postgresql.postgresqlUri" . }}:{{ template "xnat.postgresql.postgresqlPort" . }}/{{ template "xnat.postgresql.postgresqlDatabase" . }}?wrapperPlugins={{ .Values.cnpg.external.iam.wrapperPlugins }}&sslmode={{ .Values.cnpg.external.iam.sslmode }}&sslrootcert={{ .Values.cnpg.external.iam.sslrootcert }}{{ with .Values.cnpg.external.iam.region }}&iamRegion={{ . }}{{ end }}
    datasource.username={{ template "xnat.postgresql.postgresqlUsername" . }}
    datasource.password=
{{- else }}
    datasource.driver=org.postgresql.Driver
    datasource.url=jdbc:postgresql://{{ template "xnat.postgresql.postgresqlUri" . }}/{{ template "xnat.postgresql.postgresqlDatabase" . }}
    datasource.username={{ template "xnat.postgresql.postgresqlUsername" . }}
    datasource.password={{ template "xnat.postgresql.postgresqlPassword" . }}
{{- end }}
    hibernate.dialect=org.hibernate.dialect.PostgreSQL9Dialect
    hibernate.hbm2ddl.auto=update
    hibernate.show_sql=false
    hibernate.cache.use_second_level_cache=true
    hibernate.cache.use_query_cache=true
{{- if .Values.activemq.broker.enabled }}
    spring.activemq.broker-url=tcp://activemq-artemis-{{ template "xnat.fullname" . }}-0-svc:{{ .Values.activemq.broker.port }}
    spring.activemq.user={{ template "xnat.activemq.username" . }}
    spring.activemq.password={{ template "xnat.activemq.password" . }}
{{- end }}
{{- range $key := (keys .Values.extraConfig | sortAlpha) }}
    {{ $key }}={{ get $.Values.extraConfig $key }}
{{- end }}
{{- end }}
