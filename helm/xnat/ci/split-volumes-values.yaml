# Exercises the volume branches the default fixtures never reach: a volume
# split back out into its own claim, a volume adopted by existingClaim with no
# size, and a volume opting out of the keep annotation. Renders pvc.yaml's
# claim path, statefulset.yaml's `size OR existingClaim` gating, and NOTES's
# split warning. The upgrade guards stay inert under `helm template` because
# .Release.IsUpgrade is false for the deletion guard, and lookup returns
# nothing without a cluster for the resize guard, which is not upgrade-scoped.
cnpg:
  cluster:
    credentials:
      password: ci
volumes:
  xnatdata:
    size: 1Ti
  archive:
    accessMode: ReadWriteMany
    storageClass: "default"
    size: 500Gi
  cache:
    existingClaim: an-existing-cache
  build:
    keep: false
  prearchive:
    accessMode: ReadWriteMany
    storageClass: "default"
    size: 250Gi
